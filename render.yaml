# Render Blueprint: free deployment of RoktoLagbe.
# Render → New → Blueprint → pick this repo. It creates both services below.
# Values marked "sync: false" are asked for in the Render dashboard (secrets never go in git).
services:
  # ---------- Backend: Express API + Socket.IO chat ----------
  - type: web
    name: rokto-lagbe-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci && npm run chatbot:train
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: MONGO_URI # Atlas connection string (Atlas → Connect → Drivers)
        sync: false
      - key: JWT_SECRET # Render generates a strong random secret
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      # The website's address. If Render gave the static site a different name, change it here.
      - key: CLIENT_URL
        value: https://rokto-lagbe.onrender.com
      # Google OAuth client ID (public, not a secret). Must match the website's VITE_GOOGLE_CLIENT_ID.
      - key: GOOGLE_CLIENT_ID
        value: 769359302180-efuhdi9cdarl7f5veqbb8cjph1hvgde6.apps.googleusercontent.com
      # Email via the Gmail relay (Google Apps Script, see server/scripts/gmail-relay.gs).
      # Free Render blocks SMTP ports, so this HTTPS relay is the way to send email here.
      - key: EMAIL_RELAY_URL # the Apps Script "Web app URL" ending in /exec
        sync: false
      - key: EMAIL_RELAY_SECRET # long random value, same as RELAY_SECRET in the script's properties
        sync: false
      # SMTP (alternative to the relay; only works on hosts that allow SMTP ports)
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "2525"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
      # AI (optional). Without a key, the free offline parser and assistant are used.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: PARSER_ENGINE
        value: auto
      - key: ASSISTANT_ENGINE
        value: auto

  # ---------- Frontend: React (Vite) static site, served from a CDN ----------
  - type: web
    name: rokto-lagbe
    runtime: static
    rootDir: client
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      # The API's address. If Render gave the API a different name, change it and redeploy.
      - key: VITE_API_URL
        value: https://rokto-lagbe-api.onrender.com
      - key: VITE_GOOGLE_CLIENT_ID # must match the API's GOOGLE_CLIENT_ID
        value: 769359302180-efuhdi9cdarl7f5veqbb8cjph1hvgde6.apps.googleusercontent.com
      - key: VITE_SESSION_TIMEOUT_MINUTES
        value: "30"
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      # Single-page app: every path loads index.html and React Router takes over
      - type: rewrite
        source: /*
        destination: /index.html
